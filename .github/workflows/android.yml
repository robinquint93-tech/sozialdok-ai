name: SozialDok AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Node installieren
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v3

      - name: Projekt entpacken
        run: |
          mkdir -p buildsrc
          unzip -q SozialDok_AI_8_0_Android_BuildFix.zip -d buildsrc

      - name: Abhängigkeiten installieren
        working-directory: buildsrc/mobile
        run: npm install

      - name: App synchronisieren
        working-directory: buildsrc/mobile
        run: npx cap sync android

      - name: Gradle ausführbar machen
        working-directory: buildsrc/mobile/android
        run: chmod +x ./gradlew

      - name: APK bauen
        working-directory: buildsrc/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SozialDok-AI-Android
          path: buildsrc/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
