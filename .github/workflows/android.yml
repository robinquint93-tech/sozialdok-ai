name: SozialDok AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Node installieren
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v3

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt entpacken
        run: |
          mkdir -p buildsrc
          unzip -q SozialDok_AI_8_0_Android_BuildFix.zip -d buildsrc

      - name: Abhängigkeiten installieren
        working-directory: buildsrc/mobile
        run: npm install

      - name: Capacitor synchronisieren
        working-directory: buildsrc/mobile
        run: npx cap sync android

      - name: Android Projekt vorbereiten
        working-directory: buildsrc/mobile/android
        shell: bash
        run: |
          echo "Android-Projekt:"
          pwd
          echo "Dateien:"
          find . -maxdepth 2 -type f | sort

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "settings.gradle fehlt - wird erstellt."
            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SozialDok"
          include(":app")
          EOF
          fi

          echo "settings.gradle:"
          cat settings.gradle

      - name: Android APK bauen
        working-directory: buildsrc/mobile/android
        run: |
          gradle assembleDebug --no-daemon

      - name: APK finden
        shell: bash
        run: |
          APK=$(find buildsrc/mobile/android -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "FEHLER: Keine APK gefunden."
            find buildsrc/mobile/android -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK gefunden: $APK"
          mkdir -p artifact
          cp "$APK" artifact/SozialDok-AI.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SozialDok-AI-Android
          path: artifact/SozialDok-AI.apk
          if-no-files-found: error
