name: SozialDok AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Node installieren
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: buildsrc/mobile/package-lock.json

      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v3

      - name: Projekt entpacken
        run: |
          mkdir -p buildsrc
          unzip -q SozialDok_AI_8_0_Android_BuildFix.zip -d buildsrc

      - name: Abhängigkeiten installieren
        working-directory: buildsrc/mobile
        run: npm install

      - name: Vorhandenes Android-Projekt entfernen
        working-directory: buildsrc/mobile
        run: |
          rm -rf android
          echo "Altes Android-Projekt entfernt."

      - name: Android-Projekt neu erzeugen
        working-directory: buildsrc/mobile
        run: |
          npx cap add android

      - name: Capacitor synchronisieren
        working-directory: buildsrc/mobile
        run: |
          npx cap sync android

      - name: Android APK bauen
        working-directory: buildsrc/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK finden
        run: |
          APK=$(find buildsrc/mobile/android -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "FEHLER: Keine APK gefunden."
            find buildsrc/mobile/android -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK gefunden: $APK"
          mkdir -p artifact
          cp "$APK" artifact/SozialDok-AI.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SozialDok-AI-Android
          path: artifact/SozialDok-AI.apk
          if-no-files-found: error
