name: SozialDok AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Node installieren
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v3

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt entpacken
        run: |
          mkdir -p buildsrc
          unzip -q SozialDok_AI_8_0_Android_BuildFix.zip -d buildsrc

      - name: Abhängigkeiten installieren
        working-directory: buildsrc/mobile
        run: npm install

      - name: Capacitor synchronisieren
        working-directory: buildsrc/mobile
        run: npx cap sync android

      - name: Android Gradle Projekt finden und APK bauen
        shell: bash
        run: |
          echo "Suche Android-Gradle-Projekt..."

          SETTINGS_FILE=$(find buildsrc -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FEHLER: Keine settings.gradle gefunden."
            echo "Gefundene Dateien:"
            find buildsrc -maxdepth 6 -type f | head -200
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android-Projekt gefunden:"
          echo "$ANDROID_DIR"

          cd "$ANDROID_DIR"

          echo "Inhalt des Build-Ordners:"
          ls -la

          gradle assembleDebug --no-daemon

      - name: APK finden
        shell: bash
        run: |
          APK=$(find buildsrc -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "FEHLER: Keine APK gefunden."
            find buildsrc -type f | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK gefunden:"
          echo "$APK"

          mkdir -p artifact
          cp "$APK" artifact/SozialDok-AI.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SozialDok-AI-Android
          path: artifact/SozialDok-AI.apk
          if-no-files-found: error
