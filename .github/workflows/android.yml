name: SozialDok AI Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js installieren
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v3

      - name: Projekt entpacken
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q SozialDok_AI_8_0_Android_BuildFix.zip -d buildsrc

      - name: Abhängigkeiten installieren
        working-directory: buildsrc/mobile
        run: npm install

      - name: Android-Projekt erzeugen
        working-directory: buildsrc/mobile
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Debug-APK bauen
        working-directory: buildsrc/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: APK prüfen
        run: |
          APK="buildsrc/mobile/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "FEHLER: Debug-APK nicht gefunden."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p artifact
          cp "$APK" artifact/SozialDok-AI-debug.apk

      - name: Debug-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SozialDok-AI-Android-Debug
          path: artifact/SozialDok-AI-debug.apk
          if-no-files-found: error
